services:
  frontend:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://esp3-image-verificator-app:5000}
    container_name: image-verificator-frontend
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=production
    networks:
      - esp3-network

networks:
  esp3-network:
    external: true
